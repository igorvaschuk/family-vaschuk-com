name: Deploy to Firebase Hosting

# Keyless auth: GitHub's OIDC token is exchanged for short-lived Google
# credentials via Workload Identity Federation (pool "github", provider
# "family-repo" in project vaschuk-com, restricted to this repository).
# No service-account keys or repo secrets are needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

env:
  PROJECT_ID: vaschuk-com
  WIF_PROVIDER: projects/1059072294008/locations/global/workloadIdentityPools/github/providers/family-repo
  SERVICE_ACCOUNT: family-deployer@vaschuk-com.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy live site
        run: npx -y firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive
