<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Vaschuk Family</title>
  <meta name="description" content="The Vaschuk family home on the web. Coming soon!">
  <meta property="og:title" content="The Vaschuk Family">
  <meta property="og:description" content="Our family home on the web is being built. Come back soon!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6ee;
      --card: #ffffff;
      --ink: #2e2a24;
      --muted: #6f665a;
      --accent: #c8643b;
      --leaf: #5f8a5a;
      --edge: #eadfce;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1a16;
        --card: #27231e;
        --ink: #f1ebe1;
        --muted: #b3a998;
        --accent: #e38a5e;
        --leaf: #8fbf86;
        --edge: #3a342c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 28px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 40px 28px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(60, 40, 20, .08);
    }
    .house { width: 120px; height: auto; margin: 0 auto 12px; display: block; }
    .smoke { animation: drift 4s ease-in-out infinite; transform-origin: center bottom; }
    .smoke:nth-of-type(2) { animation-delay: 1.3s; }
    .smoke:nth-of-type(3) { animation-delay: 2.6s; }
    @keyframes drift {
      0% { opacity: 0; transform: translateY(6px) scale(.6); }
      40% { opacity: .7; }
      100% { opacity: 0; transform: translateY(-14px) scale(1.2); }
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.15;
      margin: 0 0 12px;
    }
    h1 span { color: var(--accent); }
    p { margin: 0 auto; color: var(--muted); max-width: 38ch; }
    .tag {
      display: inline-block;
      margin-top: 22px;
      padding: 6px 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--leaf) 16%, transparent);
      color: var(--leaf);
      font-weight: 600;
      font-size: 15px;
    }
    footer { font-size: 15px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .smoke { animation: none; opacity: .5; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="house" viewBox="0 0 120 110" aria-hidden="true">
      <circle class="smoke" cx="86" cy="22" r="5" fill="var(--edge)"/>
      <circle class="smoke" cx="90" cy="14" r="6" fill="var(--edge)"/>
      <circle class="smoke" cx="84" cy="6" r="4" fill="var(--edge)"/>
      <rect x="78" y="30" width="12" height="22" fill="var(--muted)"/>
      <path d="M14 58 L60 20 L106 58 Z" fill="var(--accent)"/>
      <rect x="24" y="56" width="72" height="46" rx="3" fill="var(--edge)"/>
      <rect x="52" y="72" width="16" height="30" rx="2" fill="var(--accent)"/>
      <rect x="32" y="66" width="13" height="13" rx="2" fill="var(--leaf)"/>
      <rect x="75" y="66" width="13" height="13" rx="2" fill="var(--leaf)"/>
    </svg>
    <h1>The <span>Vaschuk</span> Family</h1>
    <p>Our little corner of the web is being built. Photos, stories and family projects are on their way.</p>
    <div class="tag">Coming soon</div>
  </main>
  <footer>family.vaschuk.com</footer>
</body>
</html>
