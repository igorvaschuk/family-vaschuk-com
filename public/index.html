<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Vaschuk Family</title>
  <meta name="description" content="The Vaschuk family home on the web.">
  <meta property="og:title" content="The Vaschuk Family">
  <meta property="og:description" content="Our family home on the web.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Family">
  <meta name="theme-color" content="#c8643b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6ee;
      --card: #ffffff;
      --ink: #2e2a24;
      --muted: #6f665a;
      --accent: #c8643b;
      --leaf: #5f8a5a;
      --edge: #eadfce;
      --mine: #f6e3d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1a16;
        --card: #27231e;
        --ink: #f1ebe1;
        --muted: #b3a998;
        --accent: #e38a5e;
        --leaf: #8fbf86;
        --edge: #3a342c;
        --mine: #3d2e24;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }
    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; }

    /* Welcome / not-invited screens */
    .center {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 28px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 40px 28px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(60, 40, 20, .08);
    }
    .house { width: 110px; height: auto; margin: 0 auto 12px; display: block; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.15;
      margin: 0 0 12px;
    }
    h1 span { color: var(--accent); }
    .card p { margin: 0 auto 24px; color: var(--muted); max-width: 36ch; }
    .google {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
    }
    .google:hover { border-color: var(--accent); }
    .google svg { width: 20px; height: 20px; }
    .link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }
    .error { color: var(--accent); font-size: 15px; margin-top: 16px; min-height: 1.5em; }
    footer { font-size: 15px; color: var(--muted); }

    /* App shell */
    .app {
      height: 100%;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: var(--bg);
    }
    .top h2 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 22px;
      margin: 0;
      flex: 1;
      white-space: nowrap;
    }
    .top h2 span { color: var(--accent); }
    /* Dev environment strip (see js/config.js) */
    .envbar {
      background: #5f6fb8;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      padding: 5px 16px;
      padding-top: calc(5px + env(safe-area-inset-top));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body:has(.envbar:not([hidden])) .center { min-height: calc(100% - 22px); }
    body:has(.envbar:not([hidden])) :is(.chat, .app) { height: calc(100% - 22px - env(safe-area-inset-top)); }
    body:has(.envbar:not([hidden])) .top { padding-top: 10px; }
    .me { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); min-width: 0; }
    #me-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 520px) { #me-name { display: none; } }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex: none;
      object-fit: cover;
      background: var(--edge);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .avatar.bot { background: color-mix(in srgb, var(--leaf) 25%, var(--card)); font-size: 17px; }
    .tabs {
      display: flex;
      gap: 2px;
      padding: 0 8px;
      border-bottom: 1px solid var(--edge);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1 0 auto;
      border: 0;
      background: none;
      color: var(--muted);
      padding: 8px 10px 9px;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 3px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    @media (max-width: 480px) { .tab { flex-direction: column; gap: 0; font-size: 12px; padding: 6px 4px 7px; } .tab .ico { font-size: 19px; line-height: 1.2; } }
    .view { flex: 1; min-height: 0; overflow-y: auto; }
    .pad { padding: 16px; }

    /* Messages */
    .messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty { margin: auto; color: var(--muted); text-align: center; padding: 24px 8px; }
    .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
    .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
    .bubble {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 8px 12px;
      min-width: 0;
    }
    .msg.mine .bubble { background: var(--mine); }
    .msg.cmd .bubble { border-style: dashed; border-color: color-mix(in srgb, var(--leaf) 60%, var(--edge)); }
    .msg.bot .bubble { background: color-mix(in srgb, var(--leaf) 10%, var(--card)); border-color: color-mix(in srgb, var(--leaf) 35%, var(--edge)); }
    .meta { font-size: 13px; color: var(--muted); }
    .meta b { color: var(--ink); font-weight: 700; }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 0 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--leaf) 18%, transparent);
      color: var(--ink);
      margin-left: 4px;
    }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .slash { color: var(--leaf); font-weight: 700; }
    .status { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
    .status.err { color: var(--accent); }
    .refresh {
      font: inherit; font-weight: 700; color: var(--accent); background: none;
      border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; min-height: 28px;
    }
    .refresh[hidden] { display: none; }
    .working { display: flex; align-items: center; gap: 6px; }
    .working::after {
      content: ""; width: 26px; height: 6px; flex: none;
      background: radial-gradient(circle closest-side, currentColor 90%, transparent) 0 50% / 8px 6px repeat-x;
      animation: dots 1s steps(4) infinite;
      clip-path: inset(0 100% 0 0);
    }
    @keyframes dots { to { clip-path: inset(0 -8px 0 0); } }
    @media (prefers-reduced-motion: reduce) { .working::after { animation: none; clip-path: none; } }
    .notice {
      align-self: center;
      font-size: 14px;
      color: var(--muted);
      background: color-mix(in srgb, var(--leaf) 10%, transparent);
      border-radius: 12px;
      padding: 6px 12px;
      max-width: 92%;
      text-align: center;
    }
    .scope {
      position: sticky; top: 0; z-index: 1;
      display: flex; gap: 6px; justify-content: center;
      padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--edge);
    }
    .scope .btn { flex: 1; max-width: 180px; justify-content: center; }
    .gcal {
      margin: 12px 16px 0; padding: 10px 12px;
      background: var(--card); border: 1px solid var(--edge); border-radius: 14px;
      display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 14px;
    }
    .gcal .what { flex: 1 1 200px; min-width: 0; }
    .gcal .sub { display: block; color: var(--muted); font-size: 13px; }
    .gcal.err { border-color: var(--accent); }
    .gcal .import { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding-top: 8px; border-top: 1px solid var(--edge); }
    .gcal .import .sub { flex: 1 1 200px; }
    .gcal[hidden] { display: none; }
    .attach { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }

    /* Buttons & chips */
    .btn {
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.go { background: var(--leaf); border-color: var(--leaf); color: #fff; }
    .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--c, var(--muted)) 18%, transparent);
    }
    .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }

    /* Event cards */
    .ev {
      display: flex;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .ev .bar { width: 4px; border-radius: 4px; background: var(--c, var(--accent)); flex: none; }
    .ev .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .ev .title { font-weight: 700; }
    .ev .when { font-size: 14px; color: var(--muted); }
    .ev .notes { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
    .ev.gone { opacity: .6; }
    .placelink { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 14px; text-align: left; }

    /* Calendar */
    .calbar {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bg);
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--edge);
    }
    .calbar .row { justify-content: space-between; flex-wrap: nowrap; }
    .calbar .row.wrap { justify-content: flex-start; flex-wrap: wrap; }
    .calbar h3 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 19px; text-align: center; flex: 1; }
    .day { padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px; }
    .day h4 { margin: 0; font-size: 15px; color: var(--muted); }
    .day.today h4 { color: var(--accent); }
    .day .none { font-size: 14px; color: var(--muted); margin: -4px 0 0; }

    /* Map */
    #view-map { display: flex; flex-direction: column; }
    #view-map[hidden] { display: none; }
    #map { height: 52vh; min-height: 260px; flex: none; background: var(--edge); }
    .places { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
    .place {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .place .name { font-weight: 700; }
    .place .addr, .place .next { font-size: 14px; color: var(--muted); }
    .place.focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
    .leaflet-popup-content { font: 15px/1.4 "Nunito", system-ui, sans-serif; margin: 10px 12px; }
    .leaflet-popup-content .row { margin-top: 6px; }

    /* Memory */
    .mem h3 { font-family: "Fraunces", Georgia, serif; font-size: 19px; margin: 20px 0 8px; }
    .mem h3:first-child { margin-top: 0; }
    .mem ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .mem li { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; }
    .mem .sub { font-size: 13px; color: var(--muted); }
    .mem .lead { color: var(--muted); margin: 0 0 12px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .stat { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 6px 12px; font-size: 14px; }
    .stat b { font-size: 18px; margin-right: 4px; }

    /* Composer */
    .compose {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--edge);
      background: var(--bg);
    }
    .mode {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--edge);
      background: var(--card);
      font-size: 20px;
      line-height: 1;
    }
    .mode:hover { border-color: var(--accent); }
    .mic[hidden] { display: none; }
    .mic.on { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 16px; animation: listening 1.4s ease-in-out infinite; }
    @keyframes listening { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); } }
    @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
    .field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .field .to { font-size: 12px; font-weight: 700; color: var(--leaf); padding-left: 4px; }
    .compose textarea {
      width: 100%;
      resize: none;
      font: inherit;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 10px 12px;
      max-height: 140px;
      min-height: 44px;
    }
    .compose.ask textarea { border-color: var(--leaf); }
    .compose textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .compose.ask textarea:focus { outline-color: var(--leaf); }
    .send {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      height: 44px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .compose.ask .send { background: var(--leaf); }
    .send:disabled { opacity: .5; cursor: default; }
    .bell {
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .bell:hover { border-color: var(--accent); }
    .hint {
      margin: 0;
      padding: 10px 16px;
      font-size: 15px;
      color: var(--muted);
      background: color-mix(in srgb, var(--leaf) 12%, transparent);
      border-bottom: 1px solid var(--edge);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .hint span { flex: 1; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>
  <div class="envbar" data-env-badge hidden></div>
  <!-- Signed out -->
  <div class="center" id="welcome" hidden>
    <main class="card">
      <svg class="house" viewBox="0 0 120 110" aria-hidden="true">
        <rect x="78" y="30" width="12" height="22" fill="var(--muted)"/>
        <path d="M14 58 L60 20 L106 58 Z" fill="var(--accent)"/>
        <rect x="24" y="56" width="72" height="46" rx="3" fill="var(--edge)"/>
        <rect x="52" y="72" width="16" height="30" rx="2" fill="var(--accent)"/>
        <rect x="32" y="66" width="13" height="13" rx="2" fill="var(--leaf)"/>
        <rect x="75" y="66" width="13" height="13" rx="2" fill="var(--leaf)"/>
      </svg>
      <h1>The <span>Vaschuk</span> Family</h1>
      <p>Come on in! Sign in with your Google account to join the family chat.</p>
      <button class="google" id="signin">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </button>
      <div class="error" id="signin-error" role="alert"></div>
    </main>
    <footer>family.vaschuk.com</footer>
  </div>

  <!-- Signed in, but not on the family list -->
  <div class="center" id="uninvited" hidden>
    <main class="card">
      <h1>Almost there</h1>
      <p><b id="uninvited-email"></b> isn't on the family list yet. Ask Igor to add you, then come back.</p>
      <button class="link" id="switch">Use a different Google account</button>
    </main>
  </div>

  <!-- Signed in: chat, assistant, calendar, map, memory -->
  <div class="app" id="app" hidden>
    <header class="top">
      <h2>The <span>Vaschuk</span> Family</h2>
      <div class="me">
        <button class="bell" id="bell" hidden>🔔 Notify me</button>
        <span id="me-name"></span>
        <span id="me-avatar"></span>
        <button class="link" id="signout">Sign out</button>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="family"><span class="ico">💬</span>Family</button>
      <button class="tab" role="tab" data-tab="assistant"><span class="ico">✨</span>Assistant</button>
      <button class="tab" role="tab" data-tab="calendar"><span class="ico">📅</span>Calendar</button>
      <button class="tab" role="tab" data-tab="map"><span class="ico">📍</span>Map</button>
      <button class="tab" role="tab" data-tab="memory"><span class="ico">🧠</span>Memory</button>
    </nav>
    <p class="hint" id="hint" hidden>
      <span id="hint-text"></span>
      <button class="link" id="hint-close" aria-label="Dismiss">✕</button>
    </p>

    <section class="view" id="view-family" role="tabpanel" aria-label="Family chat">
      <div class="messages" id="family-list" aria-live="polite"></div>
    </section>
    <section class="view" id="view-assistant" role="tabpanel" aria-label="Assistant" hidden>
      <div class="scope" role="group" aria-label="Who sees this conversation">
        <a class="btn" id="scope-family" href="#assistant">👨‍👩‍👧 Family</a>
        <a class="btn" id="scope-me" href="#assistant/me">🔒 Just me</a>
      </div>
      <div class="gcal" id="gcal-card" hidden></div>
      <div class="messages" id="assistant-list" aria-live="polite"></div>
      <div class="messages" id="private-list" aria-live="polite" hidden></div>
    </section>
    <section class="view" id="view-calendar" role="tabpanel" aria-label="Calendar" hidden></section>
    <section class="view" id="view-map" role="tabpanel" aria-label="Map" hidden>
      <div id="map"></div>
      <div class="places" id="place-list"></div>
    </section>
    <section class="view" id="view-memory" role="tabpanel" aria-label="Memory" hidden>
      <div class="pad mem" id="memory-body"></div>
    </section>

    <form class="compose" id="compose">
      <button class="mode" id="mode" type="button"></button>
      <div class="field">
        <span class="to" id="to" hidden>✨ To the assistant</span>
        <textarea id="text" rows="1" maxlength="2000" aria-label="Message" required></textarea>
      </div>
      <button class="mode mic" id="mic" type="button" aria-label="Speak your message" aria-pressed="false" hidden>🎤</button>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
